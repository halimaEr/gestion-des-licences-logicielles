<!-- Barre supérieure -->
<div class="w-full bg-gray-100 px-4 py-4 relative flex justify-between items-center">
  <!-- Icône retour -->
  <div class="flex items-center">
    <button class="text-gray-800 hover:text-red-750 ">
      <i class="fa-solid fa-bell fa-xl"></i>
    </button>
  </div>

  <!-- Logo centré absolument -->
  <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
    <img src="/Logo-Couleur-Complet.png" alt="Logo" class="h-12" />
  </div>

  <!-- Profil utilisateur -->
  <div class="relative flex items-center cursor-pointer" (click)="toggleUserDropdown($event)">
    <img src="/ChatGPT%20Image%205%20août%202025,%2011_38_05.png" alt="Avatar" class="w-11 h-11 rounded-full object-cover border border-b-amber-100" />
    <div class="ml-3 text-gray-800 font-semibold flex flex-col">
      <span>{{ currentUser?.prenom }} {{ currentUser?.nom }}</span>
      <span class="flex items-center text-green-600 text-sm font-medium">
    <span class="w-2 h-2 rounded-full bg-green-500 mr-1"></span>
    En ligne
  </span>
    </div>      <i class="fas fa-chevron-down ml-2 text-gray-600 hover:text-gray-800"></i>

    <!-- Menu utilisateur -->
    <div *ngIf="userDropdownOpen"
         class="absolute top-full right-0 mt-2 w-64 bg-white border border-gray-200 rounded-lg shadow-lg z-50">
      <div class="px-4 py-3 border-b border-gray-100">
        <div class="font-medium text-gray-900">{{ currentUser?.prenom }} {{ currentUser?.nom }}</div>
        <div class="text-sm text-gray-500">{{ currentUser?.username }}</div>
      </div>
      <ul class="py-2">
        <li>
          <button (click)="logout()" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center">
            <i class="fas fa-sign-out-alt mr-2 text-gray-500"></i>
            Déconnexion
          </button>
        </li>
      </ul>
    </div>
  </div>
</div>
