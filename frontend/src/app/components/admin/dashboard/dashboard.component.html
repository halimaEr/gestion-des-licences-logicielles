<!-- ========== NAVBAR FIXE ========== -->
<nav class="bg-white shadow-md">
<app-layout></app-layout>
  <!-- Barre de navigation -->
  <div class="w-full bg-gray-200 px-4 py-2 flex flex-wrap justify-center sm:justify-start gap-y-2 gap-x-8 sm:gap-x-12 md:gap-x-16">

    <!-- Stats -->
    <div class="relative">
      <a 
       routerLink="/dashboard" class="flex items-center text-red-750 hover:text-red-700">
        <i class="fa-solid fa-chart-simple mr-2"></i>
        Statistiques
      </a>
     
    </div>
    <!-- Superviseurs -->
    <div class="relative">
      <button (click)="toggleDropdown('superviseurs')"
              class="flex items-center text-red-750 hover:text-red-700 focus:outline-none"
              aria-haspopup="true">
        <i class="fas fa-user-tie fa-lg mr-2"></i>
        Superviseurs
        <i class="fas fa-chevron-down fa-xs ml-1"></i>
      </button>
      <ul *ngIf="dropdowns.superviseurs"
          class="absolute mt-2 w-52 bg-white border rounded-md shadow-lg py-1 z-50">
        <li>
          <a (click)="goToResponsables(); $event.stopPropagation()"
             routerLink="responsables" (click)="closeAll()"
             class="block px-4 py-2 text-gray-700 hover:bg-gray-100 cursor-pointer">
            Responsables
          </a>
        </li>
        <li>
          <a (click)="goToGestionnaires(); $event.stopPropagation()"
             routerLink="gestionnaires" (click)="closeAll()"
             class="block px-4 py-2 text-gray-700 hover:bg-gray-100 cursor-pointer">
            Gestionnaires
          </a>
        </li>
      </ul>
    </div>

    <!-- Départements -->
    <div class="relative">
      <a 
       routerLink="/dashboard/departments" class="flex items-center text-red-750 hover:text-red-700">
        <i class="fas fa-sitemap fa-lg mr-2"></i>
        Départements
      </a>
     
    </div>

    <!-- Employés -->
    <div class="relative">
      <a
      routerLink="/dashboard/employes" class="flex items-center text-red-750 hover:text-red-700">
        <i class="fas fa-users fa-lg mr-2"></i>
        Employés
      </a>
    </div>
  </div>
</nav>

<!-- Contenu dynamique -->
<div class="px-4 py-6">
  <router-outlet></router-outlet>
</div>
