<div class="min-h-screen flex flex-col lg:flex-row bg-gray-50">
  <div class="w-full lg:w-1/2 flex flex-col p-6 lg:p-1 order-2">

    <!-- Formulaire de connexion réactif -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="max-w-md w-full mx-auto mt-10 bg-white p-8 rounded-lg shadow-md">
      <div class="text-center">
        <h1 class="text-3xl font-bold text-gray-900">Bienvenue</h1>
        <p class="mt-2 text-sm text-gray-600">Entrez vos identifiants pour accéder à votre compte</p>
      </div>

      <div class="border-t border-gray-200 my-6"></div>

      <div class="space-y-6">
        <!-- Champ Nom d'utilisateur -->
        <div class="space-y-2">
          <label for="username" class="block text-sm font-medium text-gray-700">Nom d'utilisateur</label>
          <input id="username" type="email" formControlName="username"
                 class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-gray-400 focus:border-gray-400 sm:text-sm">
          <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
               class="text-red-600 text-xs mt-1">
            <span *ngIf="loginForm.get('username')?.hasError('required')">Nom d'utilisateur requis</span>
          </div>
        </div>

        <!-- Champ Mot de passe -->
        <div class="space-y-2 relative">
          <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-gray-400 focus:border-gray-400 sm:text-sm"
          />

          <!-- Icône d'affichage/masquage du mot de passe -->
          <button
            type="button"
            class="absolute right-3 top-6 text-gray-500 hover:text-gray-700 focus:outline-none"
            (click)="toggleShowPassword()"
          >
            <i class="{{ showPassword ? 'fas fa-eye' : 'fas fa-eye-slash' }}"></i>
          </button>

          <div
            *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            class="text-red-600 text-xs mt-1"
          >
            Mot de passe requis
          </div>
        </div>

        <!-- Se souvenir de moi -->
        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember-me" type="checkbox" formControlName="rememberMe"
                   class="h-4 w-4 text-red-600 focus:ring-gray-400 border-gray-300 rounded">
            <label for="remember-me" class="ml-2 block text-sm text-gray-900">Se souvenir de moi</label>
          </div>
        </div>

        <!-- Bouton de connexion -->
        <div>
          <button type="submit"
                  [disabled]="loading"
                  class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-750 hover:bg-amber-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 disabled:opacity-50 disabled:cursor-not-allowed">
            <span *ngIf="!loading">Se connecter</span>
            <span *ngIf="loading" class="flex items-center">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Connexion en cours...
        </span>
          </button>
          <div *ngIf="errorMessage" class="mt-2 text-red-600 text-sm text-center">
            {{ errorMessage }}
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- Colonne de gauche  -->
  <div class="hidden lg:flex lg:w-1/2 bg-gray-300 items-center justify-center p-12 order-1">
    <div class="max-w-md text-center">
      <h2 class="text-2xl font-bold text-gray-800 mb-4">Gérez facilement vos licences logicielles</h2>
      <p class="text-xl text-gray-600 mb-8">Accédez à votre tableau de bord pour gérer et demander des licences</p>
    </div>
  </div>


  <!-- Logo -->
  <div class="absolute top-6 left-6 mb-5 order-1">
    <img src="/Logo-Couleur-Complet.png"
         alt="Logo Roland"
         class="h-16 object-contain">
  </div>


</div>
